{% extends "base.html" %}

{% block title %}Login | Suiyuu{% endblock %}

{% block content %}
<section class="hero">
    <h2>Entrar</h2>
    <p>Acesse sua conta para continuar sua experiência na Suiyuu.</p>
</section>

<form class="form-admin" method="post">
    {% if erro %}
        <p class="mensagem-erro">{{ erro }}</p>
    {% endif %}

    <label>
        E-mail
        <input type="email" name="email" required>
    </label>

    <label>
        Senha
        <input type="password" name="senha" required>
    </label>

    <button type="submit">Entrar</button>
    <a class="botao-secundario" href="{{ url_for('cadastro') }}">Criar conta</a>
</form>
{% endblock %}
