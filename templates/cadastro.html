{% extends "base.html" %}

{% block title %}Cadastro | Suiyuu{% endblock %}

{% block content %}
<section class="hero">
    <h2>Criar conta</h2>
    <p>Cadastre-se para acompanhar pedidos e comprar na Suiyuu.</p>
</section>

<form class="form-admin" method="post">
    {% if erro %}
        <p class="mensagem-erro">{{ erro }}</p>
    {% endif %}

    <label>
        Nome
        <input type="text" name="nome" required>
    </label>

    <label>
        E-mail
        <input type="email" name="email" required>
    </label>

    <label>
        Senha
        <input type="password" name="senha" required>
    </label>

    <button type="submit">Criar conta</button>
    <a class="botao-secundario" href="{{ url_for('login') }}">Já tenho conta</a>
</form>
{% endblock %}
