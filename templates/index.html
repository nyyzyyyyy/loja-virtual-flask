<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Loja Virtual</h1>
        <nav>
            <a href="/">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Carrinho</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Produtos em destaque</h2>
            <p>Bem-vindo à nossa loja virtual.</p>
        </section>

        <section class="produtos">
            <article class="produto-card">
                <h3>Camiseta Básica</h3>
                <p>Categoria: Roupas</p>
                <p>R$ 59,90</p>
                <button>Ver produto</button>
            </article>

            <article class="produto-card">
                <h3>Tênis Esportivo</h3>
                <p>Categoria: Calçados</p>
                <p>R$ 199,90</p>
                <button>Ver produto</button>
            </article>

            <article class="produto-card">
                <h3>Mochila Urbana</h3>
                <p>Categoria: Acessórios</p>
                <p>R$ 129,90</p>
                <button>Ver produto</button>
            </article>
        </section>
    </main>
</body>
</html>
