{% extends "base.html" %}

{% block title %}Editar Produto | Suiyuu{% endblock %}

{% block content %}
<section class="hero">
    <h2>Editar produto</h2>
    <p>Atualize as informações do item selecionado.</p>
</section>

<form class="form-admin" method="post">
    <label>
        Nome
        <input type="text" name="nome" value="{{ produto.nome }}" required>
    </label>

    <label>
        Categoria
        <input type="text" name="categoria" value="{{ produto.categoria }}" required>
    </label>

    <label>
        Preço
        <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
    </label>

    <label>
        Descrição
        <textarea name="descricao" rows="4" required>{{ produto.descricao }}</textarea>
    </label>

    <label>
        Estoque
        <input type="number" name="estoque" value="{{ produto.estoque }}" required>
    </label>

    <label>
        Imagem
        <input type="text" name="imagem" value="{{ produto.imagem }}" placeholder="exemplo: camiseta.jpg">
    </label>

    <button type="submit">Salvar alterações</button>
    <a class="botao-secundario" href="{{ url_for('admin_produtos') }}">Cancelar</a>
</form>
{% endblock %}
