{% extends "base.html" %}

{% block title %}Editar Produto | Suiyuu{% endblock %}

{% block content %}
<section class="hero">
    <h2>Editar produto</h2>
    <p>Atualize as informações, estoque e imagem do item selecionado.</p>
</section>

<form class="form-admin form-produto" method="post">
    <div class="form-preview">
        {% if produto.imagem %}
            <img
                src="{{ url_for('static', filename='img/produtos/' ~ produto.imagem) }}"
                alt="{{ produto.nome }}"
            >
        {% else %}
            <div class="produto-sem-imagem">Suiyuu</div>
        {% endif %}
    </div>

    <div class="form-grid">
        <label>
            Nome
            <input type="text" name="nome" value="{{ produto.nome }}" required>
        </label>

        <label>
            Categoria
            <input type="text" name="categoria" value="{{ produto.categoria }}" required>
        </label>

        <label>
            Preço
            <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
        </label>

        <label>
            Estoque
            <input type="number" name="estoque" value="{{ produto.estoque }}" required>
        </label>

        <label class="campo-completo">
            Imagem
            <input type="text" name="imagem" value="{{ produto.imagem }}" placeholder="exemplo: camiseta.jpg">
        </label>

        <label class="campo-completo">
            Descrição
            <textarea name="descricao" rows="5" required>{{ produto.descricao }}</textarea>
        </label>
    </div>

    <div class="form-actions">
        <button type="submit">Salvar alterações</button>
        <a class="botao-secundario" href="{{ url_for('admin_produtos') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
