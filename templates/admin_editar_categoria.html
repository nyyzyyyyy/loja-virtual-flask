{% extends "base.html" %}

{% block title %}Editar Categoria | Suiyuu{% endblock %}

{% block content %}
<section class="hero">
    <h2>Editar categoria</h2>
    <p>Atualize o nome da categoria selecionada.</p>
</section>

<form class="form-admin categoria-form" method="post">
    <label>
        Nome da categoria
        <input type="text" name="nome" value="{{ categoria.nome }}" required>
    </label>

    <button type="submit">Salvar alterações</button>
    <a class="botao-secundario" href="{{ url_for('admin_categorias') }}">Cancelar</a>
</form>
{% endblock %}
